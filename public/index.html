<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Pečat! Igra s pečatom</title>
<meta name="description" content="Navedi odgovor kojeg se nitko drugi ne bi sjetio. Što rjeđi odgovor, to dalje stižeš od šaltera do šaltera. Dnevni broj, izbori i Sabor. HR, BiH i SRB.">
<meta name="theme-color" content="#3b37a6">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pečat!">
<meta property="og:title" content="Pečat! Igra s pečatom">
<meta property="og:description" content="Navedi odgovor kojeg se nitko drugi ne bi sjetio. Novi dnevni broj svaki dan.">
<meta property="og:url" content="https://pecat-v2.vercel.app/">
<meta property="og:image" content="https://pecat-v2.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="hr_HR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pečat!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo+Narrow:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Putovanje kroz birokraciju: karta države gore, šalter u sredini, obrazac na pultu dolje. Sve se odvija na jednom ekranu. */
  --wall-hi:#dfe3d2; --wall-lo:#6e8672; --stripe:#3e5947;
  --paper:#f6f3e7; --paper-edge:#cfc9b2; --ink:#1f252b; --ink-soft:#5b6168;
  --stamp:#3b37a6; --alarm:#b3271d; --ok:#2e6b3f; --gold:#c99a2e; --led:#ff3d30; --led-bg:#170e0b;
  --wood:#8a5a3a; --sea:#c6dbe0; --land:#dfe3d2;
  --f-label:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-stamp:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-type:"IBM Plex Mono","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-label); color:var(--ink); font-size:17px; line-height:1.4; background:var(--wall-lo); min-height:100%; overflow-x:hidden}
.app{max-width:520px; margin:0 auto; padding:10px 12px 28px; display:flex; flex-direction:column; gap:10px}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--stamp); outline-offset:2px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}

/* zaglavlje */
.top{display:flex; align-items:center; gap:8px}
.brand{font-family:var(--f-stamp); font-size:22px; color:var(--stamp); background:var(--paper); border:3px solid var(--stamp); padding:0 9px 1px; border-radius:6px; transform:rotate(-3deg); line-height:1.25; margin-right:auto}
.langs{display:flex; border:2px solid var(--ink); border-radius:4px; overflow:hidden; background:var(--paper)}
.langs button{border:0; background:none; padding:6px 9px; font-weight:700; font-size:14px}
.langs button+button{border-left:2px solid var(--ink)}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.icon-btn{width:36px; height:34px; border:2px solid var(--ink); border-radius:4px; background:var(--paper); display:grid; place-items:center; padding:0}
.icon-btn svg{width:18px; height:18px}

/* karta */
.mapcard{position:relative; border:3px solid var(--ink); border-radius:8px; overflow:hidden; background:var(--sea); height:210px; transition:height .35s ease, opacity .25s, margin .35s}
.mapcard svg{display:block; width:100%; height:100%}
.mapcard .nb{fill:var(--land); stroke:#9aa79c; stroke-width:1.2}
.mapcard .main{fill:var(--paper); stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round}
.mapcard .nb{vector-effect:non-scaling-stroke}
.road-edge{fill:none; stroke:#9c9584; stroke-linecap:round; stroke-linejoin:round}
.road{fill:none; stroke:#fffdf3; stroke-linecap:round; stroke-linejoin:round}
.route-bg{fill:none; stroke:#c9a54a; stroke-linecap:round; opacity:.9}
.route-done{fill:none; stroke:var(--stamp); stroke-width:5; stroke-linecap:round; stroke-linejoin:round}
.city circle{fill:#fff; stroke:var(--ink); stroke-width:2.5}
.city.done circle{fill:var(--stamp); stroke:var(--stamp)}
.city.miss circle{fill:var(--alarm); stroke:var(--alarm)}
.city.here circle{fill:var(--gold); animation:pulse 1.2s infinite}
@keyframes pulse{50%{r:13}}
.city text{font-family:var(--f-label); font-weight:700; paint-order:stroke; stroke:var(--paper); stroke-width:4px; fill:var(--ink)}
.city text.num{font-family:var(--f-stamp); fill:#fff; stroke:none; text-anchor:middle; dominant-baseline:central}
.city.done text.num,.city.here text.num{fill:#fff}
.city:not(.done):not(.here):not(.miss) text.num{fill:var(--ink)}
.car{transition:none}
#carbody .smoke circle{animation:smoke 1.2s infinite}
@keyframes smoke{to{transform:translate(-6px,-10px); opacity:0}}
#car.swap #carbody{animation:carswap .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes carswap{0%{transform:scale(.2) rotate(-20deg)}60%{transform:scale(1.4)}100%{transform:none}}
.confirm{display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:#fff8dc; border:2px solid var(--gold); padding:8px 10px; font-size:16px; animation:slidein .3s both}
.confirm b{font-family:var(--f-type)}
.confirm .btn{padding:7px 12px; font-size:15px}
@keyframes slidein{from{transform:translateY(-8px); opacity:0}}
.led{position:absolute; top:6px; left:6px; right:6px; display:flex; justify-content:space-between; gap:6px; pointer-events:none}
.led span{background:var(--led-bg); color:var(--led); font-family:var(--f-type); font-weight:600; font-size:13px; padding:3px 8px; border-radius:4px; text-shadow:0 0 6px rgba(255,61,48,.6); font-variant-numeric:tabular-nums; border:2px solid #2b2420}
.led b{font-weight:600}
.led span.pop{animation:ledpop .5s}
@keyframes ledpop{40%{color:#fff3a8; transform:scale(1.12)}}
.toast{position:absolute; left:8px; right:8px; bottom:8px; background:var(--ink); color:var(--paper); font-family:var(--f-type); font-size:13px; padding:6px 10px; border-radius:4px; transform:translateY(140%); transition:transform .35s cubic-bezier(.2,1.2,.4,1); pointer-events:none}
.toast.on{transform:none}
body.typing .mapcard{height:0; opacity:0; margin-bottom:-10px; border-width:0}

/* šalter */
.scene{position:relative}
.booth{position:relative; background:linear-gradient(#cfd6c4,#bfc8b4); border:3px solid var(--ink); border-bottom:0; border-radius:6px 6px 0 0; padding:26px 10px 0 56px; display:flex; gap:8px; align-items:flex-end; min-height:128px; overflow:hidden; transition:min-height .3s, padding .3s}
.booth::before{content:""; position:absolute; inset:0; background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 38%,transparent 46%,transparent 62%,rgba(255,255,255,.22) 66%,transparent 70%); pointer-events:none; z-index:5}
.sign{position:absolute; top:5px; left:8px; right:8px; display:flex; justify-content:space-between; gap:6px; z-index:6; pointer-events:none}
.sign span{background:var(--ink); color:var(--paper); font-family:var(--f-type); font-size:11px; padding:2px 7px; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70%}
.sign span+span{background:var(--alarm)}
.clerk{width:104px; flex:none; position:relative; z-index:2; transition:width .3s}
.clerk svg{display:block; width:100%; height:auto}
.clerk .eyes{transform-origin:60px 56px; animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.clerk .face{display:none}
.clerk[data-mood="neutral"] .m-neutral,.clerk[data-mood="happy"] .m-happy,.clerk[data-mood="wow"] .m-wow,.clerk[data-mood="meh"] .m-meh,.clerk[data-mood="angry"] .m-angry,.clerk[data-mood="sleep"] .m-sleep,.clerk[data-mood="read"] .m-read{display:inline}
.clerk[data-mood="sleep"] .eyes{animation:none; transform:scaleY(.12)}
.clerk[data-mood="read"] .eyes{animation:readeyes .5s infinite alternate}
@keyframes readeyes{from{transform:translate(-3px,3px)}to{transform:translate(3px,3px)}}
.clerk.bounce svg{animation:cbounce .45s}
@keyframes cbounce{30%{transform:translateY(-6px)}60%{transform:translateY(2px)}}
.bubble{flex:1; align-self:center; background:#fff; border:2px solid var(--ink); border-radius:12px; padding:8px 10px; font-family:var(--f-type); font-size:14.5px; line-height:1.35; position:relative; margin-bottom:20px; min-height:52px; z-index:6}
.bubble::before{content:""; position:absolute; left:-11px; bottom:14px; border:9px solid transparent; border-right-color:var(--ink); border-left:0}
.bubble::after{content:""; position:absolute; left:-7px; bottom:16px; border:7px solid transparent; border-right-color:#fff; border-left:0}
.bubble .caret{display:inline-block; width:7px; height:1em; background:var(--ink); vertical-align:-2px; margin-left:1px; animation:car .8s steps(1) infinite}
@keyframes car{50%{opacity:0}}
/* papir u rukama službenice i hrpa odbijenih */
.inhand{position:absolute; left:104px; bottom:4px; width:56px; height:42px; background:var(--paper); border:1.5px solid var(--ink); border-radius:2px; z-index:3; transform:translateY(60px) rotate(-8deg); opacity:0; transition:transform .45s cubic-bezier(.3,1.3,.5,1), opacity .2s;
  background-image:repeating-linear-gradient(transparent 0 7px,rgba(60,70,110,.35) 7px 8px); background-position:0 6px}
.inhand.on{transform:translateY(0) rotate(-8deg); opacity:1; animation:readpaper .6s .45s infinite alternate}
@keyframes readpaper{to{transform:translateY(-3px) rotate(-3deg)}}
.inhand.toPile{animation:none; transform:translate(-92px,10px) rotate(-24deg) scale(.7); opacity:0; transition:transform .5s ease-in, opacity .5s .2s}
.pile{position:absolute; left:6px; bottom:2px; width:46px; height:90px; z-index:1}
.pile i{position:absolute; left:0; width:44px; height:10px; background:var(--paper); border:1.5px solid var(--ink); border-radius:1px}
.pile i:last-child{animation:land .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes land{from{transform:translateY(-30px) rotate(-20deg); opacity:0}}
.pile b{position:absolute; left:4px; font-family:var(--f-stamp); font-size:9px; color:var(--alarm)}
.slot{position:relative; height:12px; background:var(--wood); border:3px solid var(--ink); border-top-width:2px; border-radius:0 0 4px 4px; margin-top:-10px; z-index:4}
.slot::after{content:""; position:absolute; left:30%; right:30%; top:2px; height:4px; background:#2a170c; border-radius:2px}
body.typing .booth{min-height:84px; padding-top:22px}
body.typing .inhand{left:80px}
body.typing .clerk{width:68px}
body.typing .bubble{font-size:13px; min-height:0; margin-bottom:12px}

/* pult: obrazac */
.desk{position:relative; min-height:120px; margin-top:-4px; perspective:900px}
.sheet{background:var(--paper); border:1px solid var(--paper-edge); box-shadow:0 12px 26px rgba(20,30,22,.3); padding:14px 14px 16px; position:relative; display:flex; flex-direction:column; gap:11px;
  background-image:linear-gradient(transparent 31px,rgba(60,70,110,.08) 32px); background-size:100% 32px; transform-origin:50% 0}
.sheet.eject{animation:eject .6s cubic-bezier(.2,1,.3,1) both}
@keyframes eject{0%{transform:translateY(-110px) scale(.25,.1) rotate(-4deg); opacity:0}40%{opacity:1}70%{transform:translateY(8px) scale(1.02) rotate(.6deg)}100%{transform:none}}
.sheet.take{animation:take .45s cubic-bezier(.6,0,.8,.4) both}
@keyframes take{to{transform:translateY(-140px) scale(.3,.15) rotate(5deg); opacity:0}}
.sheet.back{animation:back .5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes back{from{transform:translateY(-120px) scale(.35) rotate(-6deg); opacity:0}}
.sheet.yellow{border-top:6px solid var(--gold)}
.form-no{margin:0; display:flex; justify-content:space-between; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; border-bottom:2px solid var(--ink); padding-bottom:5px}
h1,h2{font-family:var(--f-label); font-weight:700; margin:0; text-wrap:balance; line-height:1.12}
h1{font-size:27px}
h2{font-size:25px}
.field{display:flex; gap:8px}
.field input{flex:1; min-width:0; font-family:var(--f-type); font-size:18px; padding:11px; border:0; border-bottom:2px solid var(--ink); border-radius:0; background:rgba(255,255,255,.6); color:var(--ink)}
.field input:focus{outline:none; background:#fff; box-shadow:inset 0 -3px 0 var(--stamp)}
.btn{border:2px solid var(--ink); background:var(--ink); color:var(--paper); padding:11px 16px; font-weight:700; font-size:17px; border-radius:2px; box-shadow:3px 3px 0 rgba(0,0,0,.25); transition:transform .08s, box-shadow .08s}
.btn:active{transform:translate(2px,2px); box-shadow:none}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.stampy{background:var(--stamp); border-color:var(--stamp)}
.btn:disabled{opacity:.5}
.row{display:flex; gap:8px; flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.timer{display:flex; align-items:center; gap:10px; font-family:var(--f-type); font-size:13px; color:var(--ink-soft)}
.clock{width:26px; height:26px; flex:none}
.timer .bar{flex:1; height:8px; border:1px solid var(--ink); background:#fff; overflow:hidden}
.timer .bar i{display:block; height:100%; width:100%; background:var(--ink); transform-origin:left}
.timer.low .bar i{background:var(--alarm)}
.timer.low b{color:var(--alarm)}
.timer.low .clock{animation:shake .5s infinite}
.msg{margin:0; min-height:1.2em; color:var(--alarm); font-weight:700; font-size:14px}
.msg:empty{display:none}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; border:1.5px solid var(--ink); padding:2px 8px; border-radius:20px; background:#fff}
.chip.fire{background:var(--gold); border-color:#7a5a12; color:#2a1d02}
.given{margin:0; font-family:var(--f-type); font-size:21px; font-weight:600; overflow-wrap:anywhere}
.given.no{text-decoration:line-through; text-decoration-color:var(--alarm); text-decoration-thickness:3px; color:var(--ink-soft)}
.qsmall{margin:0; font-size:14px; color:var(--ink-soft)}
.stamp{position:absolute; right:14px; top:44px; font-family:var(--f-stamp); color:var(--stamp); border:4px double var(--stamp); border-radius:8px; padding:3px 12px 5px; font-size:24px; line-height:1.1; transform:rotate(-9deg); text-transform:uppercase; mix-blend-mode:multiply; opacity:.92; z-index:3; pointer-events:none}
.stamp.bad{color:var(--alarm); border-color:var(--alarm); transform:rotate(6deg)}
.stamp.gold{color:#8a6516; border-color:#8a6516}
.stamp.hit{animation:thud .32s cubic-bezier(.2,1.5,.4,1) both}
@keyframes thud{from{transform:rotate(-18deg) scale(2.8); opacity:0}}
.ans{display:flex; align-items:center; gap:10px; min-height:52px}
.ans .given{flex:1}
.ans .stamp{position:relative; right:auto; top:auto; flex:none; font-size:20px}
.stamp.inline{position:relative; right:auto; top:auto; align-self:flex-start}
.ink{position:absolute; width:7px; height:7px; border-radius:50%; background:var(--stamp); opacity:.7; pointer-events:none; animation:splat .6s ease-out forwards; z-index:4}
.ink.bad{background:var(--alarm)}
@keyframes splat{to{transform:translate(var(--dx),var(--dy)) scale(.4); opacity:0}}
.meter{display:flex; flex-direction:column; gap:5px}
.people{display:grid; grid-template-columns:repeat(20,1fr); gap:3px}
.people i{aspect-ratio:.55; border-radius:40% 40% 2px 2px; background:#cbc6b2; transform:scaleY(.2); transform-origin:bottom; animation:grow .3s forwards}
.people i.me{background:var(--stamp)}
.people i.bad{background:#e3b7b2}
@keyframes grow{to{transform:scaleY(1)}}
.meter p{margin:0; font-size:14px; color:var(--ink-soft)}
.meter p b{color:var(--ink)}
.could{margin:0; font-size:14px; color:var(--ink-soft); background:#fff; border-left:4px solid var(--ok); padding:6px 10px}
.could b{color:var(--ink); font-family:var(--f-type); font-weight:600}
.gain{margin:0; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:14px; color:var(--ink-soft)}
.gain b{font-family:var(--f-stamp); font-size:28px; color:var(--ink); font-variant-numeric:tabular-nums}
.gain b.km{font-size:18px; color:var(--stamp)}
.react{margin:0; font-family:var(--f-type); font-size:15px}
.notice{margin:0; align-self:flex-start; font-family:var(--f-stamp); font-size:12px; letter-spacing:.12em; background:var(--gold); color:#2a1d02; padding:3px 10px; transform:rotate(-2deg)}

/* start: automat */
.machine{display:flex; gap:14px; align-items:center}
.disp{width:112px; flex:none; position:relative}
.disp .body{background:linear-gradient(#d6392b,#a6251a); border:3px solid var(--ink); border-radius:10px 10px 4px 4px; height:122px; position:relative; box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.disp .scr{position:absolute; left:12px; right:12px; top:12px; height:34px; background:var(--led-bg); border-radius:3px; color:var(--led); font-family:var(--f-type); font-weight:600; font-size:21px; display:grid; place-items:center; text-shadow:0 0 6px rgba(255,61,48,.6)}
.disp .dslot{position:absolute; left:20px; right:20px; bottom:30px; height:6px; background:#2a0e0a; border-radius:3px}
.disp .push{position:absolute; left:50%; bottom:-14px; width:54px; height:54px; margin-left:-27px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#ffe28a,var(--gold) 60%,#8a6516); border:3px solid var(--ink); font-family:var(--f-stamp); font-size:10px; color:#2a1d02; box-shadow:0 5px 0 #4a3608; z-index:2; animation:invite 1.6s infinite}
@keyframes invite{50%{transform:scale(1.08)}}
.disp .push.down{transform:translateY(4px); box-shadow:0 1px 0 #4a3608; animation:none}
.ticket{position:absolute; left:22px; right:22px; top:80px; height:0; overflow:hidden; background:#fffdf3; border:1.5px dashed var(--ink-soft); border-top:0; font-family:var(--f-type); font-size:19px; font-weight:600; display:grid; place-items:center; transition:height .7s cubic-bezier(.3,1.3,.5,1); z-index:1}
.ticket.out{height:52px}
.rules{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; font-size:15px}
.rules li{display:flex; gap:8px; align-items:flex-start}
.rules b{font-family:var(--f-stamp); color:var(--stamp); font-size:13px; border:2px solid var(--stamp); border-radius:50%; width:22px; height:22px; flex:none; display:grid; place-items:center; transform:rotate(-8deg)}
.best{margin:0; font-size:14px; color:var(--ink-soft)}
.best b{color:var(--ink)}

/* kraj */
.decree h1{text-align:center; font-size:21px; letter-spacing:.16em; text-transform:uppercase}
.decree .sub{margin:-6px 0 0; text-align:center; font-family:var(--f-type); font-size:12px; color:var(--ink-soft)}
.slots{display:grid; grid-template-columns:repeat(4,1fr); gap:7px}
.slots div{aspect-ratio:1; border:2px dashed var(--paper-edge); border-radius:50%; display:grid; place-items:center; text-align:center; font-family:var(--f-stamp); font-size:9px; line-height:1.1; padding:5px; color:var(--stamp)}
.slots div span{opacity:0}
.slots div.on{border:3px solid var(--stamp); animation:thud .3s cubic-bezier(.2,1.5,.4,1) both; transform:rotate(-8deg)}
.slots div.on span,.slots div.x span{opacity:1}
.slots div.on:nth-child(even){transform:rotate(7deg)}
.slots div.x{border:3px solid var(--alarm); color:var(--alarm); animation:thud .3s both; transform:rotate(6deg)}
.bigstamp{align-self:center; font-family:var(--f-stamp); border:5px double; border-radius:10px; padding:5px 18px 8px; font-size:clamp(24px,8vw,38px); white-space:nowrap; text-transform:uppercase; transform:rotate(-6deg); color:var(--alarm); border-color:var(--alarm); mix-blend-mode:multiply}
.bigstamp.gold{color:#8a6516; border-color:#8a6516}
.gosub{margin:-4px 0 0; font-size:14px; color:var(--ink-soft)}
.modes{display:flex; flex-direction:column; gap:8px; width:100%; max-width:340px}
.mode{display:flex; flex-direction:column; align-items:center; gap:1px; border:3px solid var(--stamp); color:var(--stamp); background:#fff; padding:9px 12px; border-radius:4px; box-shadow:3px 3px 0 rgba(59,55,166,.25)}
.mode b{font-family:var(--f-stamp); font-size:18px; letter-spacing:.02em}
.mode small{font-size:13px; color:var(--ink-soft)}
.mode.done{border-style:dashed}
.mode:active{transform:translate(2px,2px); box-shadow:none}
.hardsw{display:flex; gap:10px; align-items:center; text-align:left; border:2px solid var(--ink); background:var(--paper); padding:8px 10px; cursor:pointer}
.hardsw input{width:22px; height:22px; accent-color:var(--alarm); flex:none}
.hardsw span{display:flex; flex-direction:column}
.hardsw small{font-size:12.5px; color:var(--ink-soft); line-height:1.25}

function submit(v,timeUp){

function canvasBlob(cv){ return new Promise(function(res){ try{ cv.toBlob(function(b){res(b);},'image/png'); }catch(e){res(null);} }); }
async function showShareImage(){
  var box=$('shbox'); if(!box) return; var sh=SHARE[S.lang];
  var cv=await makeShareImage(); if(!$('shbox')) return;
  var url; try{ url=cv.toDataURL('image/png'); }catch(e){ return; }
  box.innerHTML='<img id="shimg" src="'+url+'" alt="'+esc(shareText().replace(/\n/g,' · '))+'">'+
    '<div class="row"><button type="button" class="btn stampy" id="b-img">'+esc(sh.btn)+'</button></div><p class="msg" id="shmsg" role="status"></p>';
  $('b-img').onclick=async function(){
    var blob=await canvasBlob(cv), file=null; try{ file=blob&&new File([blob],'pecat-'+S.ticket+'.png',{type:'image/png'}); }catch(e){}
    try{ if(file&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:shareText()}); SFX.ding(); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
    try{ var a=document.createElement('a'); a.href=url; a.download='pecat-'+S.ticket+'.png'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
    $('shmsg').textContent=sh.hint;
  };
}

async function viewEnd(){
  var t=T(), tot=total(), r=E.reached(tot), win=r>=8;
  $('desk').innerHTML=''; mapState(r,!win);
  if(win){ say(t.byeWin,'happy'); }
  else {
    // službenica uzme hrpu i baci ti je u facu
    $('clerk').dataset.mood='angry'; say(t.byeLose,'angry'); await wait(900);
    var b=$('booth').getBoundingClientRect();
    SFX.whoosh(); papersInFace(Math.max(8,S.pile*3+6),{x:b.left+40,y:b.top+b.height-20}); pileDraw(0); shake($('app'));
    await wait(1500);
  }
  var x0=X(), chalRes=null, stazUp=null;
  if(S.mode==='chal'&&CHAL){ chalRes=tot>CHAL.p?{k:'win',txt:x0.chalWin(CHAL.n,tot,CHAL.p)}:(tot<CHAL.p?{k:'lose',txt:x0.chalLose(CHAL.n,tot,CHAL.p)}:{k:'tie',txt:x0.chalTie(tot)}); }
  if(S.mode==='daily'&&!S.ended){ var dk='pecat:daily:'+S.lang+':'+S.day; if(!store(dk)){ store(dk,{score:tot,r:r,m:marks()}); stazUp=stazBump(); } }
  S.ended=1;
  var slots=''; for(var i=0;i<N;i++) slots+='<div><span>'+esc(C()[i].c)+'</span></div>';
  var rows=S.results.map(function(x){ var col=!x.ok?'var(--alarm)':(x.pct<10?'var(--ok)':'var(--gold)');
    return '<tr><td><span class="dot" style="background:'+col+'"></span></td><td><span class="q">'+esc(x.q)+'</span>'+esc(x.text||t.noAns)+'</td><td>'+x.pts+'</td></tr>'; }).join('')+
    S.bonus.map(function(b){return '<tr><td><span class="dot" style="background:var(--stamp)"></span></td><td><span class="q">'+esc(t.bonusRow)+'</span>'+esc(b.label)+'</td><td>'+(b.pts>0?'+':'−')+Math.abs(b.pts)+'</td></tr>';}).join('');
  desk('<div class="decree" style="display:contents"><h1>'+esc(t.decree)+'</h1><p class="sub">'+esc(t.decreeSub(S.ticket))+'</p>'+
   '<div class="slots" id="slots">'+slots+'</div>'+
   '<p class="score"><b id="sc">0</b> '+bod(tot)+'</p>'+
   '<div class="bigstamp'+(win?' gold':'')+'" id="bigst" style="visibility:hidden">'+esc(win?t.win:t.lose)+'</div>'+
   '<p class="endmsg">„'+esc(L[S.lang].end[END_IX[r]])+'”</p>'+
   '<div class="shbox" id="shbox"><div class="shph"></div></div>'+
   (chalRes?'<p class="chalres '+chalRes.k+'">'+esc(chalRes.txt)+'</p>':'')+
   (stazUp?'<p class="staz up">'+esc(X().stazUp(stazUp))+(X().medal[stazUp]?' <span class="medal">'+stazUp+'</span> '+esc(X().medal[stazUp]):'')+'</p>':'')+
   '<div class="vote" id="vote"></div>'+
   '<pre class="share" id="share">'+esc(shareText())+'</pre>'+
   '<p class="msg" id="msg" role="status" style="color:var(--ok)"></p>'+
   '<div class="row"><button type="button" class="btn stampy" id="b-copy">'+esc(t.copy)+'</button><button type="button" class="btn" id="b-chal2">⚔ '+esc(x0.chal)+'</button><button type="button" class="btn ghost" id="b-again">'+esc(t.again)+'</button></div>'+
   '<details class="sheetbox"><summary>'+esc(t.answers)+'</summary><table class="tbl">'+rows+'</table></details></div>','eject');
  overview(false);
  var cells=document.querySelectorAll('#slots div'), d=RM?0:220;
  for(var j=0;j<N;j++)(function(j){ setTimeout(function(){ if(j<r){cells[j].classList.add('on'); SFX.stamp();} else if(j===r){cells[j].classList.add('x'); SFX.bad();} }, 500+j*d); })(j);
  var sc=$('sc'); sc.dataset.v=0; setTimeout(function(){ countTo(sc,tot); },500);
  setTimeout(function(){ var bs=$('bigst'); if(!bs)return; bs.style.visibility='visible'; bs.style.animation='thud .32s cubic-bezier(.2,1.5,.4,1) both'; SFX.stamp(); inkSplat(bs,!win); shake($('sheet'));
    if(r>=7){ confetti(); SFX.win(); } },500+Math.min(N,r+1)*d+200);
  $('b-copy').onclick=function(){ var done=function(ok){$('msg').textContent=ok?t.copied:t.copyFail; if(ok)SFX.ding();};
    try{navigator.clipboard.writeText(shareText()).then(function(){done(true);},function(){done(false);});}catch(e){done(false);} };
  setTimeout(showShareImage,RM?0:600);
  if(!S.voted){ S.voted=1; hook('end',{lang:S.lang,score:tot,reached:r,hard:S.hard,mode:S.mode,day:S.day,
    answers:S.results.map(function(x){ return [x.qid,x.aid,x.base||0,x.text||'',x.q,x.miss||[]]; })},$('vote')); }
  $('b-chal2').onclick=function(){
    var me=(window.PECAT_ME&&window.PECAT_ME())||'', stop=r?C()[r-1].c:'—';
    var url=location.origin+location.pathname+'?izazov='+b64u({l:S.lang,i:S.ids,e:S.evAt,s:S.seed,p:tot,r:r,c:stop,n:me,h:S.hard?1:0});
    var txt=x0.chalShare(stop,tot);
    if(navigator.share) navigator.share({title:'Pečat!',text:txt,url:url}).catch(function(){});
    else { try{ navigator.clipboard.writeText(txt+' '+url).then(function(){ $('msg').textContent=x0.chalCopied; SFX.ding(); }); }catch(e){ $('msg').textContent=url; } }
  };
  $('b-again').onclick=function(){S.phase='start'; S.ticket=0; S.results=[]; S.used={}; S.bonus=[]; S.ended=0; if(S.mode==='chal'){ CHAL=null; try{ history.replaceState(null,'',location.pathname+location.search.replace(/[?&]izazov=[^&]*/,'').replace(/^&/,'?')); }catch(e){} } render();};
}

function render(){
  stopTimer();
  if(S.phase!=='start' && !S.ids.length) S.phase='start';
  if(S.phase==='fb' && !S.results[S.idx]) S.phase='q';
  if(S.phase==='ev' && !S.ev) S.phase='q';
  chrome();
  ({start:viewStart,q:viewQ,fb:viewFb,ev:viewEv,end:viewEnd})[S.phase]();
}

Array.prototype.forEach.call(document.querySelectorAll('.langs button'),function(b){
  b.onclick=function(){ if(S.lang===b.dataset.lang||busy) return; S.lang=b.dataset.lang; store('pecat:lang',S.lang); S.phase='start'; S.ticket=0; S.results=[]; S.used={}; S.ids=[]; S.bonus=[]; buildMap(); render(); };
});
$('snd').onclick=function(){ soundOn=!soundOn; store('pecat:sound',soundOn); sndIcon(); if(soundOn){ac(); SFX.ding();} };
document.addEventListener('keydown',function(e){ if(e.key==='Enter' && (S.phase==='fb'||S.phase==='ev') && document.activeElement && document.activeElement.id!=='b-next'){ var b=$('b-next'); if(b){e.preventDefault(); b.click();} } });
window.addEventListener('resize',function(){ if(!RT)return; if(S.phase==='start'||S.phase==='end') overview(true); else followCar(300,true); });

function attachViews(){ var V=window.PECAT_VIEWS||{}; for(var id in V){ try{ var q=byId(id); if(q && !q._idx) q.views=V[id]; }catch(e){} } }
function start(snap){
  attachViews();
  var saved=store('pecat:lang'); if(saved && L[saved]) S.lang=saved;
  if(snap && snap.lang && L[snap.lang] && snap.ids){ for(var k in snap) S[k]=snap[k]; if(S.phase==='end'){} }
  sndIcon(); buildMap(); render();
  if(S.phase!=='start'){ placeCarAt(S.carDist||0); if(S.phase!=='end') followCar(300,true); pileDraw(S.pile||0); }
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(function(){return {lang:S.lang,phase:S.phase==='fb'||S.phase==='ev'||S.phase==='q'?S.phase:S.phase,ids:S.ids,idx:S.idx,results:S.results,used:S.used,ticket:S.ticket,streak:S.streak,bonus:S.bonus,mod:S.mod,evAt:S.evAt,evSeen:S.evSeen,ev:S.ev,pile:S.pile,carDist:S.carDist,car:S.car,mode:S.mode,seed:S.seed,hard:S.hard,day:S.day,ended:S.ended,voted:S.voted};});
if(hot&&hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
})();
</script>
