<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pečat! · prijedlozi pitanja</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f6f3e7;color:#1f252b;margin:0;padding:16px;max-width:760px;margin:auto}
h1{font-size:22px} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input,textarea,select{font:inherit;padding:8px;border:2px solid #1f252b;background:#fff;width:100%;box-sizing:border-box}
textarea{min-height:70px} button{font:inherit;font-weight:700;padding:8px 14px;border:2px solid #1f252b;background:#1f252b;color:#fff;cursor:pointer}
button.g{background:#fff;color:#1f252b} .card{border:2px solid #1f252b;background:#fff;padding:12px;margin:12px 0;display:flex;flex-direction:column;gap:6px}
small{color:#5b6168} label{font-size:13px;font-weight:700} .msg{color:#2e6b3f}
</style>
</head>
<body>
<h1>Prijedlozi pitanja</h1>
<p><small>Odgovori se odvajaju s <b>;</b>, a druga imena istog odgovora s <b>|</b>. Redoslijed od najčešćeg prema najrjeđem. „Otvoreno” znači da se prihvaća i smislen odgovor kojeg nema na popisu.</small></p>
<div class="row"><input id="key" type="password" placeholder="ADMIN_KEY" style="flex:1"><select id="lang" style="width:auto"><option value="hr">HR</option><option value="ba">BiH</option><option value="rs">SRB</option></select><button id="load">Učitaj</button></div>
<p class="msg" id="msg"></p>
<div id="list"></div>
<script>
var $=function(i){return document.getElementById(i);};
try{ $('key').value=sessionStorage.getItem('pk')||''; }catch(e){}
function api(path,body){ var o={headers:{'x-admin-key':$('key').value,'Content-Type':'application/json'}}; if(body){o.method='POST';o.body=JSON.stringify(body);}
  return fetch('/api/'+path,o).then(function(r){return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||r.status); return j; });}); }
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function load(){
  try{ sessionStorage.setItem('pk',$('key').value); }catch(e){}
  var l=$('lang').value;
  api('admin/suggestions?lang='+l).then(function(j){
    $('msg').textContent='Odobreno do sada: '+j.approved+' · na čekanju: '+j.suggestions.length;
    $('list').innerHTML=j.suggestions.map(function(s){ return '<div class="card" data-id="'+esc(s.id)+'"><small>'+esc(s.who)+' · '+new Date(s.ts).toLocaleString('hr')+'</small>'+
      '<label>Pitanje</label><input class="q" value="'+esc(s.q)+'"><label>Fora službenice</label><input class="f" value="'+esc(s.f)+'">'+
      '<label>Odgovori</label><textarea class="a">'+esc(s.a)+'</textarea><label><input type="checkbox" class="o" style="width:auto"> Otvoreno pitanje</label>'+
      '<div class="row"><button class="ok">Odobri</button><button class="g no">Odbij</button></div></div>'; }).join('')||'<p>Nema novih prijedloga.</p>';
    Array.prototype.forEach.call(document.querySelectorAll('.card'),function(c){
      c.querySelector('.ok').onclick=function(){ api('admin/approve',{lang:l,id:c.dataset.id,q:c.querySelector('.q').value,f:c.querySelector('.f').value,a:c.querySelector('.a').value,o:c.querySelector('.o').checked}).then(load).catch(function(e){alert(e.message);}); };
      c.querySelector('.no').onclick=function(){ api('admin/reject',{lang:l,id:c.dataset.id}).then(load); };
    });
  }).catch(function(e){ $('msg').textContent='Greška: '+e.message; $('list').innerHTML=''; });
}
$('load').onclick=load; $('lang').onchange=load;
</script>
</body>
</html>
